[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiotech"
version = "0.4.4"
description = "Middleware neuro-symbolique et calcul adaptatif sous contraintes géométriques (SCG)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "scg*"]
